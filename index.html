<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Family Tree</title>
<meta name="theme-color" content="#8C6A45">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- AUTH GATE -->
  <div id="auth-gate" class="auth-gate">
    <div class="auth-card">
      <div class="auth-brand">🌳 My Family Tree</div>

      <div id="auth-signin" class="auth-panel">
        <p class="auth-text">Sign in with Google to view the family tree.</p>
        <button id="btn-google-signin" class="auth-btn">
          <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 16 3 9 7.4 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.1-5.1l-6.5-5.5C29.6 36 27 37 24 37c-5.2 0-9.6-3.3-11.3-8l-6.6 5C9 40.6 16 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.4 35.9 45 30.5 45 24c0-1.4-.1-2.5-.4-3.5z"/></svg>
          Sign in with Google
        </button>
      </div>
    </div>
  </div>

  <header id="app-header" class="hidden">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">🌳</span>
        <span class="brand-name">My Family Tree</span>
      </div>

      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="Search a name…" autocomplete="off">
        <div id="search-results" class="search-results hidden"></div>
      </div>

      <nav class="view-tabs">
        <button class="tab-btn active" data-view="explorer">Explorer</button>
        <button class="tab-btn" data-view="tree">Full Tree</button>
        <button class="tab-btn" data-view="browse">Browse All</button>
        <button class="tab-btn" data-view="map">Map</button>
        <button class="tab-btn" data-view="timeline">Timeline</button>
        <button class="tab-btn" data-view="dashboard">Dashboard</button>
        <button class="tab-btn hidden" id="tab-pending" data-view="pending">Pending <span id="pending-count-badge" class="pending-count-badge hidden"></span></button>
      </nav>

      <button id="btn-quick-add" class="add-btn" title="Add a child linked under the person you're currently viewing">+ Add</button>

      <div class="tools-wrap">
        <button id="btn-tools" class="ghost-btn" title="Account &amp; data tools">⚙</button>
        <div id="tools-menu" class="tools-menu hidden">
          <div id="tools-account-info" class="tools-account-info"></div>
          <button id="btn-add-person" class="tools-menu-item">+ Add an unlinked person</button>
          <button id="btn-export-data" class="tools-menu-item">⬇ Copy data as text (backup)</button>
          <button id="btn-manage-access" class="tools-menu-item hidden">👥 Manage approvers</button>
          <button id="btn-signout" class="tools-menu-item">Sign out</button>
        </div>
      </div>
    </div>
  </header>

  <main id="app-main" class="hidden">

    <!-- EXPLORER VIEW -->
    <section id="view-explorer" class="view">
      <div class="explorer-toolbar">
        <button id="btn-back" class="ghost-btn" title="Back">← Back</button>
        <button id="btn-forward" class="ghost-btn" title="Forward">Forward →</button>
        <button id="btn-home" class="ghost-btn" title="Go to Mark">🏠 Home</button>
        <div id="breadcrumb" class="breadcrumb"></div>
      </div>
      <div id="explorer-canvas" class="explorer-canvas"></div>
    </section>

    <!-- FULL TREE VIEW -->
    <section id="view-tree" class="view hidden">
      <div class="tree-toolbar">
        <label for="tree-root-select">Starting ancestor:</label>
        <select id="tree-root-select"></select>
        <button id="btn-expand-all" class="ghost-btn">Expand all</button>
        <button id="btn-collapse-all" class="ghost-btn">Collapse all</button>
        <button id="btn-go-to-me" class="ghost-btn">🎯 Go to me</button>
        <span class="toolbar-spacer"></span>
        <button id="btn-zoom-out" class="ghost-btn" title="Zoom out">&minus;</button>
        <button id="btn-zoom-reset" class="ghost-btn" title="Reset zoom">100%</button>
        <button id="btn-zoom-in" class="ghost-btn" title="Zoom in">+</button>
      </div>
      <div id="tree-canvas-wrap" class="tree-canvas-wrap">
        <div id="tree-canvas" class="tree-canvas"></div>
      </div>
    </section>

    <!-- BROWSE ALL VIEW -->
    <section id="view-browse" class="view hidden">
      <div class="browse-toolbar">
        <span id="browse-count" class="browse-count"></span>
        <div class="sort-controls">
          Sort by:
          <button class="sort-btn active" data-sort="name">Name</button>
          <button class="sort-btn" data-sort="birth">Birth date</button>
          <button class="sort-btn" data-sort="generation">Generation</button>
        </div>
      </div>
      <div class="browse-filters">
        <select id="filter-generation"><option value="">All generations</option></select>
        <select id="filter-decade"><option value="">All decades</option></select>
        <select id="filter-status">
          <option value="">Living &amp; deceased</option>
          <option value="living">Living only</option>
          <option value="deceased">Deceased only</option>
        </select>
        <select id="filter-gender">
          <option value="">All genders</option>
          <option value="f">Female</option>
          <option value="m">Male</option>
        </select>
        <button id="btn-clear-filters" class="ghost-btn">Clear filters</button>
      </div>
      <div id="browse-table-wrap" class="browse-table-wrap">
        <table id="browse-table">
          <thead>
            <tr><th>Name</th><th>Gender</th><th>Born</th><th>Died</th><th>Parents</th></tr>
          </thead>
          <tbody id="browse-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- MAP VIEW -->
    <section id="view-map" class="view hidden">
      <div class="map-toolbar">
        <label class="map-toggle"><input type="radio" name="map-mode" value="both" checked> Birthplace &amp; residence</label>
        <label class="map-toggle"><input type="radio" name="map-mode" value="birth"> Birthplace only</label>
        <label class="map-toggle"><input type="radio" name="map-mode" value="residence"> Residence only</label>
      </div>
      <div id="map-container" class="map-container"></div>
      <div id="map-unplaced" class="map-unplaced"></div>
    </section>

    <!-- TIMELINE VIEW -->
    <section id="view-timeline" class="view hidden">
      <div class="timeline-toolbar">
        <label class="map-toggle"><input type="checkbox" id="filter-tl-births" checked> Births</label>
        <label class="map-toggle"><input type="checkbox" id="filter-tl-marriages" checked> Marriages</label>
        <label class="map-toggle"><input type="checkbox" id="filter-tl-deaths" checked> Deaths</label>
        <span class="toolbar-spacer"></span>
        <button id="btn-timeline-expand-all" class="ghost-btn">Expand all</button>
        <button id="btn-timeline-collapse-all" class="ghost-btn">Collapse all</button>
      </div>
      <div id="timeline-list" class="timeline-list"></div>
    </section>

    <!-- DASHBOARD VIEW -->
    <section id="view-dashboard" class="view hidden">
      <div id="dashboard-content" class="dashboard-content"></div>
    </section>

    <!-- PENDING CHANGES VIEW (approvers only) -->
    <section id="view-pending" class="view hidden">
      <div id="pending-list" class="pending-list"></div>
    </section>

  </main>

  <div id="detail-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="modal-edit" class="modal-edit" title="Edit this person">✎ Edit</button>
      <button id="modal-close" class="modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="access-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button id="access-modal-close" class="modal-close">✕</button>
      <div id="access-modal-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
